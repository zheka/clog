<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CLog</title>
    <meta name="theme-color" content="#1e1e24" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Climbing Log</h1>
        <button
          id="openMenuBtn"
          class="menu-btn"
          aria-label="Data & Backup Menu"
          title="Data & Backup"
        >
          <svg viewBox="0 0 24 24">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </header>

      <div id="problemRoot"></div>

      <main id="mainContent">
        <div id="historyList" class="history-list"></div>
      </main>

      <button id="openModalBtn" class="fab" aria-label="New Attempt">+</button>

      <div id="menuRoot"></div>

      <div id="modalOverlay" class="modal-overlay">
        <div class="modal-sheet">
          <div class="modal-header">
            <span id="modalTitle" class="modal-title">New Attempt</span>
            <button id="closeModalBtn" class="close-btn">&times;</button>
          </div>

          <form id="attemptForm">
            <!-- Collapsible context: activity and location -->
            <div class="form-group">
              <label>Context</label>
              <div id="contextHeader" class="context-accordion-header">
                <span id="contextSummaryText" class="context-summary"></span>
                <svg class="group-chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
              <div id="contextBody" class="context-collapsible-body hidden">
                <div class="form-group">
                  <label>Activity</label>
                  <div class="activity-picker" id="activityPicker"></div>
                </div>

                <div class="form-group">
                  <label for="locationInput">Location</label>
                  <input
                    type="text"
                    id="locationInput"
                    class="required-input"
                    placeholder="add location"
                    autocomplete="off"
                  />
                  <div id="locationChips" class="chips-container"></div>
                </div>
              </div>
            </div>

            <!-- The selected activity's own fields (from config.ts), rendered by the app -->
            <div id="activityFields" class="activity-fields"></div>

            <!-- Outcome: tapping a chip saves the attempt; typing finds or adds an outcome -->
            <div class="form-group">
              <label for="outcomeInput">Outcome</label>
              <input
                type="text"
                id="outcomeInput"
                placeholder="find or add an outcome"
                autocomplete="off"
              />
              <div id="outcomeChips" class="outcome-row"></div>
              <!-- Shown while a new outcome name is typed: one chip per category -->
              <div id="newOutcomeChips" class="outcome-row new-outcome-row"></div>
            </div>

            <div class="form-actions">
              <button type="button" id="deleteBtn" class="delete-btn">Delete</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
